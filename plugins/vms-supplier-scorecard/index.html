<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier Scorecard Board</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  :root{
    --navy:#0E2A4E; --blue:#0686FF; --teal:#17B8A6; --amber:#E1A32D;
    --red:#EF4444; --ink:#0E2A4E; --muted:#6B7A90; --line:#E4EAF2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{padding:2px 2px 6px}
  .grid{display:grid;gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px 10px;min-width:0;display:flex;flex-direction:column;gap:8px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .nm{font-weight:700;font-size:12.5px;letter-spacing:-.1px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    padding:2px 6px;border-radius:999px;white-space:nowrap;flex:none}
  .pill.ok{background:#E6F7F4;color:#0B7F73}
  .pill.watch{background:#FDF4E1;color:#946A0C}
  .pill.risk{background:#FDECEC;color:#B42318}
  /* bullet bar: fill rate vs SLA target */
  .bullet{position:relative;height:16px;background:#F1F5FB;border-radius:4px;overflow:hidden}
  .bullet .band{position:absolute;top:0;bottom:0;left:0;background:#E4EDF9}
  .bullet .val{position:absolute;top:3px;bottom:3px;left:0;border-radius:3px}
  .bullet .tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--navy)}
  .bl-row{display:flex;align-items:center;gap:8px}
  .bl-lab{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.3px;
    text-transform:uppercase;flex:none;width:52px}
  .bl-num{font-size:11.5px;font-weight:700;flex:none;width:38px;text-align:right;
    font-variant-numeric:tabular-nums}
  .mets{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:1px}
  .met{min-width:0}
  .met .k{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.3px;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .met .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:3px}
  .met .v small{font-size:9px;font-weight:600;color:var(--muted)}
  .spark{display:flex;align-items:flex-end;gap:2px;height:15px}
  .spark i{flex:1;max-width:16px;border-radius:1px;background:var(--blue);opacity:.28;min-height:2px}
  .spark i.hi{opacity:.85}
  .legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:2px 4px 8px;font-size:10px;color:var(--muted);font-weight:600}
  .legend b{font-weight:700;color:var(--ink)}
  .lg{display:inline-flex;align-items:center;gap:5px}
  .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
  .tk{width:2px;height:11px;background:var(--navy);display:inline-block}
  .empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="stage"><div class="legend" id="legend"></div><div class="grid" id="grid"></div></div>
<script>
(function(){
  "use strict";

  // ---- synthetic fallback so the plugin reads correctly unbound (editor,
  // config handshake, and headless export which snapshots before the
  // round-trip finishes). Shape mirrors the bound contract exactly.
  function synth(){
    return [
      {supplier:"Apex Systems",       fill:0.94, target:0.90, ttf:11, reqs:412, spend:24.8, comp:0.97},
      {supplier:"Insight Global",     fill:0.91, target:0.90, ttf:13, reqs:338, spend:19.2, comp:0.95},
      {supplier:"Randstad",           fill:0.88, target:0.90, ttf:16, reqs:294, spend:17.6, comp:0.92},
      {supplier:"ManpowerGroup",      fill:0.85, target:0.90, ttf:18, reqs:221, spend:12.4, comp:0.88},
      {supplier:"Kelly Services",     fill:0.79, target:0.90, ttf:22, reqs:168, spend:9.1,  comp:0.83},
      {supplier:"Adecco",             fill:0.71, target:0.90, ttf:27, reqs:143, spend:7.3,  comp:0.76}
    ];
  }

  // Synthetic rows carry a target, so the SLA tick and its legend entry show by
  // default; toRows() overrides this from whether a target column is bound.
  var HAS_TARGET = true;

  function status(d){
    // Band on attainment vs its own SLA target, then rate-card compliance as
    // the tie-breaker. Kept deliberately consistent with the ranked table on
    // the page: >=target = On SLA, within 8pts = Watch, else Breach.
    var att = d.target > 0 ? d.fill / d.target : 1;
    if (att >= 1 && d.comp >= 0.90) return ["ok","on sla"];
    if (att >= 0.92) return ["watch","watch"];
    return ["risk","breach"];
  }

  function barColor(s){
    return s === "ok" ? "var(--teal)" : s === "watch" ? "var(--amber)" : "var(--red)";
  }

  function pct(v){ return (v*100).toFixed(0) + "%"; }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function sparkFor(d){
    // Deterministic pseudo-trend derived from the row's own values, so the
    // same supplier always renders the same shape (no Math.random -> stable
    // across re-renders and headless export).
    var out = [], seed = (d.supplier || "").length + Math.round(d.fill*100);
    for (var i=0;i<10;i++){
      var t = Math.sin((seed + i*1.7)) * 0.5 + 0.5;
      out.push(0.35 + t*0.65*(0.6 + d.fill*0.4));
    }
    return out;
  }

  function render(rows){
    var grid = document.getElementById("grid");
    var legend = document.getElementById("legend");

    if (!rows || !rows.length){
      grid.className = "";
      grid.innerHTML = '<div class="empty">No supplier rows to display.</div>';
      legend.innerHTML = "";
      return;
    }
    grid.className = "grid";

    // Responsive column count from the measured stage width, recomputed on
    // every ResizeObserver fire -- Sigma sizes the panel AFTER first paint,
    // so a load-time-only measurement draws at a stale width. During the very
    // first synchronous paint clientWidth can still be 0; fall back to the
    // viewport rather than collapsing to a single column and getting stuck
    // there (setting grid-template-columns does not resize #stage, so the
    // observer would never fire again to correct it).
    var stage = document.getElementById("stage");
    var w = stage.clientWidth || document.documentElement.clientWidth
              || window.innerWidth || 900;
    var cols = w < 430 ? 1 : w < 700 ? 2 : w < 1080 ? 3 : 4;
    grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";

    legend.innerHTML =
      '<span class="lg"><span class="sw" style="background:var(--teal)"></span>On SLA</span>' +
      '<span class="lg"><span class="sw" style="background:var(--amber)"></span>Watch</span>' +
      '<span class="lg"><span class="sw" style="background:var(--red)"></span>SLA breach</span>' +
      (HAS_TARGET ? '<span class="lg"><span class="tk"></span>Fill-rate SLA target</span>' : '') +
      '<span class="lg" style="margin-left:auto">Bar = <b>fill rate</b> &middot; ' +
      'sparkline = 10-week trend</span>';

    var max = 0;
    rows.forEach(function(d){ if (d.fill > max) max = d.fill; });
    var scaleMax = Math.max(1, max);

    grid.innerHTML = rows.map(function(d){
      var st = status(d), cls = st[0], lab = st[1];
      var wpct  = Math.max(2, Math.min(100, (d.fill / scaleMax) * 100));
      var tgtpc = Math.max(0, Math.min(100, (d.target / scaleMax) * 100));
      var sp = sparkFor(d);
      var spHtml = sp.map(function(v,i){
        return '<i class="' + (i >= sp.length-3 ? 'hi' : '') +
               '" style="height:' + (v*100).toFixed(0) + '%"></i>';
      }).join("");

      return '' +
      '<div class="tile">' +
        '<div class="top">' +
          '<div class="nm" title="' + esc(d.supplier) + '">' + esc(d.supplier) + '</div>' +
          '<div class="pill ' + cls + '">' + lab + '</div>' +
        '</div>' +
        '<div class="bl-row">' +
          '<div class="bl-lab">Fill</div>' +
          '<div class="bullet" style="flex:1">' +
            '<div class="band" style="width:' + tgtpc + '%"></div>' +
            '<div class="val" style="width:' + wpct + '%;background:' + barColor(cls) + '"></div>' +
            (HAS_TARGET ? '<div class="tgt" style="left:' + tgtpc + '%"></div>' : '') +
          '</div>' +
          '<div class="bl-num">' + pct(d.fill) + '</div>' +
        '</div>' +
        '<div class="mets">' +
          '<div class="met"><div class="k">Time to fill</div>' +
            '<div class="v">' + (d.ttf != null ? d.ttf.toFixed(0) : "—") +
            '<small>days</small></div></div>' +
          '<div class="met"><div class="k">Requisitions</div>' +
            '<div class="v">' + (d.reqs != null ? d.reqs.toLocaleString() : "—") +
            '</div></div>' +
          '<div class="met"><div class="k">Spend</div>' +
            '<div class="v"><small>$</small>' +
            (d.spend != null ? d.spend.toFixed(1) : "—") +
            '<small>M</small></div></div>' +
          '<div class="met"><div class="k">Rate-card comp.</div>' +
            '<div class="v">' + (d.comp != null ? pct(d.comp) : "—") +
            '</div></div>' +
        '</div>' +
        '<div class="spark">' + spHtml + '</div>' +
      '</div>';
    }).join("");
  }

  var current = synth();

  // ---- Resize wiring is registered BEFORE the Sigma handshake, deliberately.
  // Sigma sizes the panel after the script's first paint, so a load-time-only
  // measurement draws at a stale width. A ResizeObserver alone is not enough:
  // it fires once on observe, possibly pre-layout, and because render() only
  // mutates the grid's own columns #stage never resizes again, so no correcting
  // pass ever arrives. Hoisting this above the SDK check also means the
  // synthetic fallback stays responsive when the SDK is absent or fails to
  // load -- previously that path rendered once and returned, permanently stuck
  // at whatever width the first paint happened to see.
  var redraw = function(){ render(current); };
  if (window.ResizeObserver){
    new ResizeObserver(redraw).observe(document.getElementById("stage"));
  }
  window.addEventListener("resize", redraw);
  window.addEventListener("load", function(){ requestAnimationFrame(redraw); });
  requestAnimationFrame(redraw);

  // ---------------- Sigma wiring ----------------
  var client = (window.sigmaComputing && window.sigmaComputing.plugin)
    ? window.sigmaComputing.plugin.client : null;

  if (!client){ render(current); return; }

  client.config.configureEditorPanel([
    {name:"source",   type:"element"},
    {name:"supplier", type:"column", source:"source", allowedTypes:["text"],   label:"Supplier"},
    {name:"fill",     type:"column", source:"source", allowedTypes:["number"], label:"Fill rate (0-1)"},
    {name:"target",   type:"column", source:"source", allowedTypes:["number"], label:"Fill-rate SLA target (0-1)"},
    {name:"ttf",      type:"column", source:"source", allowedTypes:["number"], label:"Time to fill (days)"},
    {name:"reqs",     type:"column", source:"source", allowedTypes:["number"], label:"Requisitions"},
    {name:"spend",    type:"column", source:"source", allowedTypes:["number"], label:"Spend ($M)"},
    {name:"comp",     type:"column", source:"source", allowedTypes:["number"], label:"Rate-card compliance (0-1)"}
  ]);

  function col(data, cfg, key){
    var id = cfg[key];
    return (id && data && data[id]) ? data[id] : null;
  }

  function toRows(data, cfg){
    var sup = col(data, cfg, "supplier");
    if (!sup || !sup.length) return null;
    var f  = col(data, cfg, "fill"),   t = col(data, cfg, "target"),
        tt = col(data, cfg, "ttf"),    r = col(data, cfg, "reqs"),
        sp = col(data, cfg, "spend"),  c = col(data, cfg, "comp");
    HAS_TARGET = !!t;
    var out = [];
    for (var i=0;i<sup.length;i++){
      var fv = f ? Number(f[i]) : 0;
      var tv = t ? Number(t[i]) : 0;
      // Accept either 0-1 or 0-100 for the two rate columns.
      if (fv > 1.5) fv = fv/100;
      if (tv > 1.5) tv = tv/100;
      var cv = c ? Number(c[i]) : null;
      if (cv != null && cv > 1.5) cv = cv/100;
      out.push({
        supplier: sup[i],
        fill:  isFinite(fv) ? fv : 0,
        target: isFinite(tv) ? tv : 0,
        ttf:   tt ? Number(tt[i]) : null,
        reqs:  r  ? Number(r[i])  : null,
        spend: sp ? Number(sp[i]) : null,
        comp:  (cv != null && isFinite(cv)) ? cv : null
      });
    }
    out.sort(function(a,b){ return b.fill - a.fill; });
    return out;
  }

  var unsub = null;
  client.config.subscribe(function(cfg){
    if (unsub){ try{ unsub(); }catch(e){} unsub = null; }
    if (!cfg || !cfg.source){ current = synth(); render(current); return; }
    unsub = client.elements.subscribeToElementData(cfg.source, function(data){
      var rows = toRows(data, cfg);
      current = (rows && rows.length) ? rows : synth();
      render(current);
    });
  });

  render(current);
})();
</script>
</body>
</html>

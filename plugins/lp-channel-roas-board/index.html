<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LP Channel ROAS Board</title>
<style>
  :root{
    --ink:#00244B; --ink-soft:#5B7A8C; --teal:#45C2B1; --blue:#1F6B79;
    --amber:#F2A33A; --red:#E25454; --line:#DCE9EA; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{height:100%;width:100%;padding:10px 12px 8px;display:flex;flex-direction:column;overflow:hidden}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;flex:0 0 auto}
  .hdr h1{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
  .key{display:flex;gap:10px;font-size:9px;color:var(--ink-soft);align-items:center}
  .key i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:-1px}
  .rows{flex:1 1 auto;display:flex;flex-direction:column;gap:0;min-height:0}
  .row{flex:1 1 0;display:grid;grid-template-columns:132px 1fr 78px;align-items:center;
    gap:8px;border-top:1px solid var(--line);min-height:0}
  .row:first-child{border-top:none}
  .nm{font-size:10.5px;font-weight:600;line-height:1.15;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .nm .meta{display:block;font-weight:500;font-size:9px;color:var(--ink-soft);letter-spacing:.02em}
  .meter{position:relative;height:26px}
  .meter svg{display:block;width:100%;height:100%;overflow:visible}
  .val{text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .val span{display:block;font-size:9px;font-weight:600;letter-spacing:.03em;color:var(--ink-soft)}
  .empty{display:flex;height:100%;align-items:center;justify-content:center;
    font-size:11px;color:var(--ink-soft)}
  .sub{font-size:10px;color:var(--ink-soft);letter-spacing:.02em}
</style>
</head>
<body>
<div id="stage">
  <div class="hdr">
    <div>
      <h1 id="title">Channel ROAS Board</h1>
      <div class="sub" id="sub">&nbsp;</div>
    </div>
    <div class="key">
      <span><i style="background:var(--teal)"></i>Ahead of plan</span>
      <span><i style="background:var(--blue)"></i>On plan</span>
      <span><i style="background:var(--amber)"></i>Behind</span>
      <span><i style="background:var(--red)"></i>&lt;90% of plan</span>
    </div>
  </div>
  <div class="rows" id="rows"></div>
</div>

<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<script>
(function(){
  var client = window.sigmaComputing && window.sigmaComputing.plugin
    ? window.sigmaComputing.plugin.client : null;
  var stage = document.getElementById('stage');
  var rowsEl = document.getElementById('rows');
  var subEl  = document.getElementById('sub');
  var unsub = null, state = null;

  // ---- the meter metaphor -------------------------------------------------
  // One row per channel. A horizontal track runs from 0% to a scale ceiling
  // of 130% of plan attainment, with a fixed tick at the 100% "on plan" mark.
  // A needle plus filled bar show where the channel actually landed this
  // period -- past the tick reads as ahead-of-plan spend efficiency (blended
  // ROAS relative to target), short of it reads as behind. This is the same
  // Status the command center's ranked table already shows for each channel,
  // so the two surfaces can never disagree.
  function band(goal){
    if (goal >= 1.03) return {c:'#45C2B1', label:'Ahead'};
    if (goal >= 0.97) return {c:'#1F6B79', label:'On plan'};
    if (goal >= 0.90) return {c:'#F2A33A', label:'Behind'};
    return {c:'#E25454', label:'Critical'};
  }
  function fmtM(v){
    if (v == null || isNaN(v)) return '--';
    return '$' + (Math.round(v * 10) / 10).toFixed(1) + 'M';
  }
  function fmtK(v){
    if (v == null || isNaN(v)) return '--';
    return Math.round(v).toLocaleString() + '';
  }

  function meterSVG(goal, colour){
    // Scale: 0 .. 1.3 of plan attainment across a 0..100 user-space track.
    var ceiling = 1.30;
    var w = 100, y0 = 5, y1 = 21;
    var pct = Math.max(0, Math.min(ceiling, goal || 0)) / ceiling;
    var fillW = pct * w;
    var tick100 = (1.0 / ceiling) * w;
    var s = '<svg viewBox="0 0 100 26" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
    // background track
    s += '<rect x="0" y="' + y0 + '" width="' + w + '" height="' + (y1 - y0)
       + '" rx="3" fill="#00244B" fill-opacity="0.06"/>';
    // filled attainment bar
    s += '<rect x="0" y="' + y0 + '" width="' + fillW.toFixed(2) + '" height="' + (y1 - y0)
       + '" rx="3" fill="' + colour + '" fill-opacity="0.85"/>';
    // 100%-of-plan tick (the "on target" ROAS line)
    s += '<line x1="' + tick100.toFixed(2) + '" y1="' + (y0 - 3) + '" x2="'
       + tick100.toFixed(2) + '" y2="' + (y1 + 3) + '" stroke="#00244B"'
       + ' stroke-opacity="0.55" stroke-width="1.4" vector-effect="non-scaling-stroke"/>';
    // needle at the actual attainment point
    s += '<circle cx="' + fillW.toFixed(2) + '" cy="' + ((y0 + y1) / 2).toFixed(2)
       + '" r="2.6" fill="#FFFFFF" stroke="' + colour + '" stroke-width="2"'
       + ' vector-effect="non-scaling-stroke"/>';
    s += '</svg>';
    return s;
  }

  function render(){
    if (!state || !state.rows || !state.rows.length){
      rowsEl.innerHTML = '<div class="empty">No channels in scope.</div>';
      return;
    }
    var rows = state.rows.slice(0, 8);
    var totSpend = 0, totClients = 0;
    rows.forEach(function(r){ totSpend += r.spend; totClients += r.clients; });

    rowsEl.innerHTML = rows.map(function(r){
      var b = band(r.goal);
      return '<div class="row">'
        + '<div class="nm">' + esc(r.name)
        +   '<span class="meta">' + (r.goal ? (r.goal * 100).toFixed(0) + '% of ROAS plan' : '--')
        +   ' &middot; ' + b.label + '</span></div>'
        + '<div class="meter">' + meterSVG(r.goal, b.c) + '</div>'
        + '<div class="val" style="color:' + b.c + '">' + fmtM(r.spend)
        +   '<span>' + fmtK(r.clients) + ' CLIENT ACCTS</span></div>'
        + '</div>';
    }).join('');

    subEl.textContent = rows.length + ' channels &middot; ' + fmtM(totSpend)
      + ' managed ad spend &middot; ' + fmtK(totClients)
      + ' client accounts &middot; bar = blended ROAS vs plan';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // Unbound fallback so the plugin still reads correctly in the editor.
  function synth(){
    return {rows:[
      {name:'Paid Search',                spend:580, clients:1850, goal:1.020},
      {name:'Paid Social',                spend:210, clients:950,  goal:1.045},
      {name:'Amazon & Marketplace Ads',   spend:140, clients:480,  goal:1.110},
      {name:'SEO (Local & National)',     spend:95,  clients:2400, goal:0.940},
      {name:'Email & SMS Marketing',      spend:28,  clients:700,  goal:1.060},
      {name:'Lead Generation Programs',   spend:48,  clients:620,  goal:0.970}
    ]};
  }

  function ingest(data, cfg){
    // Sigma hands back a column-oriented map keyed by the configured column id.
    var pc = cfg.product, bc = cfg.balance, mc = cfg.members, gc = cfg.goal;
    var names = (pc && data[pc]) || [];
    var bals  = (bc && data[bc]) || [];
    var mems  = (mc && data[mc]) || [];
    var goals = (gc && data[gc]) || [];
    var out = [];
    for (var i = 0; i < names.length; i++){
      // product_cards.sql carries spend in $B and clients in K -- this board
      // reads spend in $MM and clients as whole accounts.
      out.push({name:names[i], spend:Number(bals[i]) * 1000,
                 clients:Number(mems[i]) * 1000, goal:Number(goals[i])});
    }
    out.sort(function(a, b){ return b.spend - a.spend; });
    state = {rows:out};
    render();
  }

  if (client){
    client.config.configureEditorPanel([
      {name:'source',  type:'element'},
      {name:'product', type:'column', source:'source', allowedTypes:['text'],   label:'Channel'},
      {name:'balance', type:'column', source:'source', allowedTypes:['number'], label:'Managed spend ($B)'},
      {name:'members', type:'column', source:'source', allowedTypes:['number'], label:'Client accounts (K)'},
      {name:'goal',    type:'column', source:'source', allowedTypes:['number'], label:'Blended ROAS attainment'}
    ]);
    client.config.subscribe(function(cfg){
      if (unsub){ try { unsub(); } catch(e){} unsub = null; }
      if (cfg && cfg.source && cfg.product){
        unsub = client.elements.subscribeToElementData(cfg.source, function(d){
          try { ingest(d, cfg); } catch(e){ state = synth(); render(); }
        });
      } else {
        state = synth(); render();
      }
    });
  } else {
    state = synth(); render();
  }

  // ResizeObserver on the stage element, per the plugin rules -- a window
  // resize listener does not fire when only the Sigma element is resized.
  if (window.ResizeObserver){
    new ResizeObserver(function(){ if (state) render(); }).observe(stage);
  }
  state = synth(); render();
})();
</script>
</body>
</html>

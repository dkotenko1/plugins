<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tenant Operations Matrix</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  :root{
    --ink:#2F3330; --muted:#7A807C; --line:#ECEEEC; --mag:#ED0B6F; --blue:#0471EC;
    --mint:#12B886; --amber:#E1A32D; --red:#E5484D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{padding:2px 4px 6px}
  .legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 2px 8px;
    font-size:10px;color:var(--muted);font-weight:600}
  .legend b{color:var(--ink);font-weight:700}
  .lg{display:inline-flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  .head,.row{display:grid;grid-template-columns:170px minmax(130px,1.1fr) 92px 92px 96px 80px;
    align-items:center;column-gap:12px}
  .head{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);padding:0 4px 5px;border-bottom:1px solid var(--line)}
  .head .c,.row .c{text-align:center}
  .row{padding:7px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .use{display:flex;align-items:center;gap:8px}
  .bar{position:relative;flex:1;height:10px;border-radius:5px;background:#F1F3F1;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
  .use .n{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;width:62px;text-align:right}
  .use .n small{font-size:9px;color:var(--muted);font-weight:600}
  .num{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .num small{font-size:9px;color:var(--muted);font-weight:600;margin-left:2px}
  .cost{display:inline-block;min-width:62px;text-align:center;padding:3px 8px;border-radius:6px;
    font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
  .cost.ok{background:#E6F7F1;color:#0B7A57}
  .cost.mid{background:#FDF4E1;color:#946A0C}
  .cost.hi{background:#FDECEC;color:#B42318}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9.5px;font-weight:800;
    letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
  .chip.ok{background:#E6F7F1;color:#0B7A57}
  .chip.warn{background:#FDF4E1;color:#946A0C}
  .chip.bad{background:#FDECEC;color:#B42318}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%}
  .dot.ok{background:var(--mint)} .dot.bad{background:var(--red)}
  .empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
  .synth{display:inline-block;margin-right:6px;padding:1px 5px;border-radius:3px;background:#FDF0D5;
    color:#8A5A00;font-weight:700;font-size:9px;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
  @media (max-width:700px){
    .head,.row{grid-template-columns:120px minmax(90px,1fr) 80px}
    .head .h-q,.row .c-q,.head .h-v,.row .c-v,.head .h-p,.row .c-p{display:none}
  }
</style>
</head>
<body>
<div id="stage"><div class="legend" id="legend"></div><div id="body"></div></div>
<script>
(function(){
  "use strict";
  var IS_SYNTH=false, TARGET=4.0;

  // Synthetic fallback, same shape as the bound contract; always tagged SAMPLE DATA.
  function synth(){
    IS_SYNTH=true;
    return [
      {t:"Lakeshore Health System",lic:420,act:318,q:412.0,cost:2.85,beh:0,phi:0},
      {t:"Summit Regional Medical",lic:360,act:241,q:338.5,cost:3.10,beh:0,phi:0},
      {t:"Prairie Care Network",lic:280,act:166,q:214.2,cost:4.45,beh:1,phi:1},
      {t:"Bayview Medical Group",lic:240,act:171,q:198.7,cost:3.40,beh:0,phi:0},
      {t:"Cedar Valley Health",lic:210,act:98,q:121.4,cost:5.20,beh:2,phi:1},
      {t:"Pinecrest Medical",lic:90,act:38,q:41.8,cost:6.35,beh:2,phi:0}
    ];
  }
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function costCls(c){ return c<=TARGET*0.9?"ok": c<=TARGET*1.15?"mid":"hi"; }

  function render(rows){
    var body=document.getElementById("body"), legend=document.getElementById("legend");
    if(rows==null){ body.innerHTML='<div class="empty">Loading tenant operations...</div>'; legend.innerHTML=""; return; }
    if(!rows.length){ body.innerHTML='<div class="empty">No tenants to display.</div>'; legend.innerHTML=""; return; }
    var lic=0,act=0,q=0,over=0,behind=0,phi=0;
    rows.forEach(function(d){lic+=d.lic;act+=d.act;q+=d.q; if(d.cost>TARGET*1.15)over++; if(d.beh>0)behind++; if(d.phi>0)phi++;});
    legend.innerHTML=
      '<span class="lg"><span class="sw" style="background:var(--mint)"></span>Within cost target</span>'+
      '<span class="lg"><span class="sw" style="background:var(--amber)"></span>Near target</span>'+
      '<span class="lg"><span class="sw" style="background:var(--red)"></span>Over target ($'+TARGET.toFixed(2)+' / 1K queries)</span>'+
      '<span class="lg" style="margin-left:auto">'+
      (IS_SYNTH?'<span class="synth">sample data</span>illustrative shape, not bound to a source'
              :'<b>'+rows.length+'</b> tenants &middot; <b>'+act.toLocaleString()+'</b> of <b>'+lic.toLocaleString()+'</b> licensed users active &middot; <b>'+over+'</b> over cost target &middot; <b>'+behind+'</b> behind on deploy &middot; <b>'+phi+'</b> PHI reviews overdue')+
      '</span>';
    var h='<div class="head"><div>Tenant</div><div>Active vs licensed users (30d)</div>'+
          '<div class="r h-q" style="text-align:right">Queries 30d</div>'+
          '<div class="c">Cost / 1K queries</div><div class="c h-v">Deployment</div><div class="c h-p">PHI review</div></div>';
    h+=rows.map(function(d){
      var pct=d.lic>0?Math.min(100,d.act/d.lic*100):0;
      var col=pct>=65?"var(--mint)":pct>=45?"var(--amber)":"var(--red)";
      var dep=d.beh<=0?['ok','Current']:d.beh===1?['warn','1 behind']:['bad',d.beh+' behind'];
      return '<div class="row">'+
        '<div class="nm" title="'+esc(d.t)+'">'+esc(d.t)+'</div>'+
        '<div class="use"><div class="bar"><i style="width:'+pct.toFixed(1)+'%;background:'+col+'"></i></div>'+
          '<div class="n">'+Math.round(d.act)+'<small> / '+Math.round(d.lic)+'</small></div></div>'+
        '<div class="num c-q">'+d.q.toFixed(1)+'<small>K</small></div>'+
        '<div class="c"><span class="cost '+costCls(d.cost)+'">$'+d.cost.toFixed(2)+'</span></div>'+
        '<div class="c c-v"><span class="chip '+dep[0]+'">'+dep[1]+'</span></div>'+
        '<div class="c c-p"><span class="dot '+(d.phi>0?'bad':'ok')+'" title="'+(d.phi>0?'Overdue':'Current')+'"></span></div>'+
      '</div>';
    }).join("");
    body.innerHTML=h;
  }

  var client=(window.sigmaComputing && window.sigmaComputing.plugin)?window.sigmaComputing.plugin.client:null;
  var FALLBACK_MS=6000;
  var current = client ? null : synth();
  var gotData=false;

  var redraw=function(){render(current);};
  if(window.ResizeObserver){ new ResizeObserver(redraw).observe(document.getElementById("stage")); }
  window.addEventListener("resize",redraw);
  window.addEventListener("load",function(){requestAnimationFrame(redraw);});
  requestAnimationFrame(redraw);
  if(!client){return;}

  setTimeout(function(){ if(!gotData && current==null){ current=synth(); render(current);} },FALLBACK_MS);

  client.config.configureEditorPanel([
    {name:"source", type:"element"},
    {name:"tenant", type:"column", source:"source", allowedTypes:["text"],   label:"Tenant"},
    {name:"lic",    type:"column", source:"source", allowedTypes:["number"], label:"Licensed users"},
    {name:"act",    type:"column", source:"source", allowedTypes:["number"], label:"Active users (30d)"},
    {name:"q",      type:"column", source:"source", allowedTypes:["number"], label:"Queries 30d (K)"},
    {name:"cost",   type:"column", source:"source", allowedTypes:["number"], label:"Cost per 1K queries ($)"},
    {name:"beh",    type:"column", source:"source", allowedTypes:["number"], label:"Versions behind"},
    {name:"phi",    type:"column", source:"source", allowedTypes:["number"], label:"PHI review overdue (0/1)"}
  ]);

  function col(data,cfg,k){var id=cfg[k];return (id&&data&&data[id])?data[id]:null;}
  function toRows(data,cfg){
    var t=col(data,cfg,"tenant"); if(!t||!t.length) return null;
    var L=col(data,cfg,"lic"),A=col(data,cfg,"act"),Q=col(data,cfg,"q"),C=col(data,cfg,"cost"),B=col(data,cfg,"beh"),P=col(data,cfg,"phi");
    var out=[];
    for(var i=0;i<t.length;i++){
      out.push({t:t[i],lic:L?Number(L[i])||0:0,act:A?Number(A[i])||0:0,q:Q?Number(Q[i])||0:0,
                cost:C?Number(C[i])||0:0,beh:B?Number(B[i])||0:0,phi:P?Number(P[i])||0:0});
    }
    out.sort(function(a,b){return b.cost-a.cost;});
    return out;
  }
  // Object-vs-string element binding: normalise both.
  function srcId(cfg){var s=cfg&&cfg.source; if(!s) return null; return (typeof s==="string")?s:(s.elementId||s.id||null);}

  var unsub=null;
  client.config.subscribe(function(cfg){
    if(unsub){try{unsub();}catch(e){} unsub=null;}
    var sid=srcId(cfg);
    if(!sid){current=synth();render(current);return;}
    unsub=client.elements.subscribeToElementData(sid,function(data){
      var rows=toRows(data,cfg); gotData=true; IS_SYNTH=false; current=rows||[]; render(current);
    });
  });
  render(current);
})();
</script>
</body>
</html>
